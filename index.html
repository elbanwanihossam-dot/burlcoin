<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');
        body {
            margin: 0; background: #020205; color: white;
            font-family: 'Orbitron', sans-serif; overflow: hidden;
            height: 100vh; display: flex; flex-direction: column;
            /* خلفية فضاء حقيقية */
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png'), 
                              radial-gradient(circle at center, #1b2735 0%, #020205 100%);
        }

        .header { padding: 15px; display: flex; justify-content: space-around; background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); }
        .balance-box { 
            margin: 20px auto; padding: 20px; width: 80%;
            background: rgba(255, 255, 255, 0.05); border-radius: 20px;
            border: 1px solid rgba(0, 212, 255, 0.3); text-align: center;
        }

        .coin-zone { flex: 1; display: flex; align-items: center; justify-content: center; }
        
        /* صورة العملة (رابط مباشر جديد بجودة عالية) */
        .main-coin {
            width: 260px; height: 260px;
            background: url('https://cdn-icons-png.flaticon.com/512/8142/8142142.png') no-repeat center;
            background-size: contain; cursor: pointer;
            filter: drop-shadow(0 0 40px #00d4ff);
            animation: float 3s ease-in-out infinite;
            transition: transform 0.1s;
        }

        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-15px) rotate(5deg); } }
        .main-coin:active { transform: scale(0.9); }

        /* القائمة السفلية باحترافية */
        .nav {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
            padding: 15px; background: #0a0a0f; border-top: 1px solid #333;
        }
        .nav-item {
            text-align: center; font-size: 10px; color: #aaa;
            background: rgba(255,255,255,0.03); padding: 10px 5px; border-radius: 12px;
        }
        .nav-item img { width: 22px; display: block; margin: 0 auto 5px; filter: hue-rotate(180deg); }
    </style>
</head>
<body>
    <div class="header">
        <div id="btc" style="color:#f7931a">BTC: $--</div>
        <div id="ton" style="color:#0088cc">TON: $--</div>
    </div>

    <div class="balance-box">
        <div style="font-size: 10px; opacity: 0.5;">TOTAL BURL</div>
        <div style="font-size: 35px; font-weight: 900; color: #00d4ff;" id="bal">0</div>
    </div>

    <div class="coin-zone">
        <div class="main-coin" onclick="tap(event)"></div>
    </div>

    <div style="text-align:center; padding-bottom: 10px;">
        <div style="font-size: 12px;">⚡ <span id="nrg">1000</span> / 1000</div>
    </div>

    <div class="nav">
        <div class="nav-item"><img src="https://cdn-icons-png.flaticon.com/512/2171/2171221.png">GAMES</div>
        <div class="nav-item"><img src="https://cdn-icons-png.flaticon.com/512/10000/10000570.png">WALLET</div>
        <div class="nav-item"><img src="https://cdn-icons-png.flaticon.com/512/1069/1069159.png">TASKS</div>
        <div class="nav-item"><img src="https://cdn-icons-png.flaticon.com/512/1250/1250592.png">INVITE</div>
    </div>

    <script>
        let b = 0; let e = 1000;
        const tg = window.Telegram.WebApp;
        tg.expand();

        function tap(ev) {
            if(e > 0) {
                b++; e--;
                document.getElementById('bal').innerText = b.toLocaleString();
                document.getElementById('nrg').innerText = e;
                tg.HapticFeedback.impactOccurred('medium');
            }
        }

        async function getPrice() {
            try {
                const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,the-open-network&vs_currencies=usd');
                const d = await r.json();
                document.getElementById('btc').innerText = 'BTC: $' + d.bitcoin.usd.toLocaleString();
                document.getElementById('ton').innerText = 'TON: $' + d['the-open-network'].usd;
            } catch(e) {}
        }
        setInterval(getPrice, 10000); getPrice();
    </script>
</body>
</html>
