<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');
        body { margin: 0; background: #020205; color: white; font-family: 'Orbitron', sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        #space-canvas { position: fixed; top: 0; left: 0; z-index: -1; }
        
        /* تصميم زرار المحفظة Web3 */
        #ton-connect-btn { position: absolute; top: 15px; right: 15px; z-index: 100; transform: scale(0.8); }

        .balance-section { text-align: center; padding-top: 60px; }
        .bal-amount { font-size: 50px; font-weight: 900; color: #fff; text-shadow: 0 0 20px #00d4ff; }
        
        .main-mining { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        .coin-box { width: 250px; height: 250px; cursor: pointer; transition: 0.1s; filter: drop-shadow(0 0 30px #7241ff); }
        .coin-box img { width: 100%; height: 100%; }

        .footer-web3 { display: grid; grid-template-columns: repeat(4, 1fr); padding: 15px; background: rgba(0,0,0,0.9); border-top: 1px solid #333; }
        .nav-item { text-align: center; font-size: 10px; color: #888; cursor: pointer; }
        .nav-item img { width: 22px; margin-bottom: 5px; }
        .nav-item.active { color: #00d4ff; }
    </style>
</head>
<body>
    <canvas id="space-canvas"></canvas>
    
    <div id="ton-connect-btn"></div>

    <div class="balance-section">
        <div style="font-size: 12px; color: #00d4ff;">BURL TOKEN BALANCE</div>
        <div class="bal-amount" id="bal">0</div>
    </div>

    <div class="main-mining">
        <div class="coin-box" onclick="tap(event)">
            <img src="https://static.smartone.com/common/images/crypto/eth_logo.png" id="coin">
        </div>
    </div>

    <div style="padding: 15px;">
        <div style="display:flex; justify-content:space-between; font-size:11px; margin-bottom:5px;">
            <span>⚡ ENERGY: <span id="nrg">1000</span></span>
            <span id="wallet-status" style="color:#7241ff">WALLET: DISCONNECTED</span>
        </div>
        <div style="width:100%; height:8px; background:#111; border-radius:10px; overflow:hidden;">
            <div id="nrg-bar" style="width:100%; height:100%; background:linear-gradient(90deg, #7241ff, #00d4ff);"></div>
        </div>
    </div>

    <div class="footer-web3">
        <div class="nav-item active"><img src="https://cdn-icons-png.flaticon.com/512/3813/3813681.png"><br>TAP</div>
        <div class="nav-item"><img src="https://cdn-icons-png.flaticon.com/512/2583/2583218.png"><br>UPGRADE</div>
        <div class="nav-item"><img src="https://cdn-icons-png.flaticon.com/512/9187/9187604.png"><br>TEAM</div>
        <div class="nav-item" onclick="showAirdrop()"><img src="https://cdn-icons-png.flaticon.com/512/10000/10000570.png"><br>AIRDROP</div>
    </div>

    <script>
        let b = 0, e = 1000;
        const tg = window.Telegram.WebApp; tg.expand();

        // إعداد TonConnect Web3
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://raw.githubusercontent.com/ton-connect/demo-dapp/main/public/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-btn'
        });

        // مراقبة حالة المحفظة
        tonConnectUI.onStatusChange(wallet => {
            if (wallet) {
                document.getElementById('wallet-status').innerText = "WALLET: CONNECTED ✅";
                document.getElementById('wallet-status').style.color = "#00ff88";
                tg.showAlert("Wallet Connected Successfully!");
            }
        });

        function tap(ev) {
            if(e > 0) {
                b += 1; e -= 1;
                document.getElementById('bal').innerText = b.toLocaleString();
                document.getElementById('nrg').innerText = e;
                document.getElementById('nrg-bar').style.width = (e/10) + '%';
                tg.HapticFeedback.impactOccurred('medium');
            }
        }

        // محرك الخلفية الفضائية
        const canvas = document.getElementById('space-canvas'), ctx = canvas.getContext('2d');
        let stars = [];
        function init() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            for(let i=0; i<100; i++) stars.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, r:Math.random()*1.5, v:Math.random()*0.5});
        }
        function anim() {
            ctx.clearRect(0,0,canvas.width,canvas.height); ctx.fillStyle="white";
            stars.forEach(s => { ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill(); s.y+=s.v; if(s.y>canvas.height) s.y=0; });
            requestAnimationFrame(anim);
        }
        init(); anim();
    </script>
</body>
</html>
