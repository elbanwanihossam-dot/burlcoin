<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BurlCoin Galactic Web3 Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Exo+2:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root { --neon-blue: #00f2ff; --neon-purple: #bc13fe; --gold: #f3ba2f; }
        body { margin: 0; background: #000; color: #fff; font-family: 'Exo 2', sans-serif; overflow: hidden; }
        
        /* حاوية محرك الـ 3D */
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }

        .ui-wrapper { height: 100vh; display: flex; flex-direction: column; z-index: 10; position: relative; padding: 15px; box-sizing: border-box; background: rgba(0,0,0,0.2); }

        /* شريط البورصة العالمي (Binance/OKX Style) */
        .market-ticker { background: rgba(0,0,0,0.6); border-bottom: 1px solid var(--neon-blue); padding: 5px; font-size: 10px; white-space: nowrap; overflow: hidden; display: flex; gap: 20px; }
        .ticker-move { display: flex; animation: scroll 20s linear infinite; }
        @keyframes scroll { from { transform: translateX(100%); } to { transform: translateX(-100%); } }

        /* كارت المحفظة الاحترافي */
        .wallet-hub { background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05)); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 15px; backdrop-filter: blur(15px); display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .exchange-icons img { width: 24px; margin-left: 10px; filter: grayscale(1) brightness(2); transition: 0.3s; }
        .exchange-icons img.active { filter: grayscale(0) brightness(1); }

        /* عداد الكوين الضخم */
        .main-display { text-align: center; margin-top: 10px; }
        .balance-num { font-family: 'Syncopate', sans-serif; font-size: 3.5rem; font-weight: 700; text-shadow: 0 0 20px var(--neon-blue); margin: 0; }
        .usd-val { color: var(--neon-blue); font-size: 14px; letter-spacing: 3px; }

        /* العملة الـ 3D التفاعلية */
        .clicker-zone { flex-grow: 1; display: flex; justify-content: center; align-items: center; }
        #burl-portal { width: 280px; height: 280px; border-radius: 50%; position: relative; cursor: pointer; transition: 0.1s; }
        #burl-portal:active { transform: scale(0.92); }

        /* شبكة الفيتشرز (Features) */
        .features-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 90px; }
        .feat-card { background: rgba(0,0,0,0.5); border: 1px solid rgba(0,242,255,0.3); padding: 10px; border-radius: 12px; text-align: center; font-size: 11px; }
        .feat-card i { font-size: 18px; color: var(--neon-blue); display: block; margin-bottom: 5px; }

        /* نافبار المستقبل */
        nav { position: fixed; bottom: 15px; left: 15px; right: 15px; background: rgba(10,10,15,0.9); border: 1px solid var(--neon-blue); border-radius: 50px; height: 70px; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 0 30px rgba(0,242,255,0.2); }
        .nav-item { color: #555; font-size: 10px; text-align: center; cursor: pointer; }
        .nav-item.active { color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); }
    </style>
</head>
<body>

<div id="canvas-container"></div>

<div class="market-ticker">
    <div class="ticker-move" id="ticker-content">
        TON/USD: $5.42 (+2.1%) • BTC/USD: $64,231 • OKX BURL: $0.0025 • BINANCE TON: $5.43 • BYBIT TON: $5.41
    </div>
</div>

<div class="ui-wrapper">
    <header class="wallet-hub">
        <div>
            <small style="display:block; opacity:0.6">WEB3 STATUS</small>
            <b id="wallet-status">DISCONNECTED</b>
        </div>
        <div class="exchange-icons">
            <img src="https://cryptologos.cc/logos/binance-coin-bnb-logo.png" title="Binance">
            <img src="https://cryptologos.cc/logos/toncoin-ton-logo.png" class="active" title="TON Connect">
            <img src="https://pbs.twimg.com/profile_images/1615563963428134913/OitUvGMc_400x400.jpg" title="OKX" style="border-radius: 50%">
        </div>
        <button onclick="connectWeb3()" style="background:var(--neon-blue); border:none; padding:10px 15px; border-radius:10px; font-weight:bold; cursor:pointer">CONNECT</button>
    </header>

    <div class="main-display">
        <h1 class="balance-num" id="bal">0</h1>
        <div class="usd-val" id="usd-est">$0.00 USD</div>
    </div>

    <div class="clicker-zone">
        <div id="burl-portal" onclick="handleTap(event)"></div>
    </div>

    <div class="features-grid">
        <div class="feat-card"><i>🚀</i>Boosters</div>
        <div class="feat-card"><i>💎</i>Staking</div>
        <div class="feat-card"><i>🌍</i>Nodes</div>
        <div class="feat-card"><i>⛓️</i>Bridge</div>
        <div class="feat-card"><i>📉</i>DEX</div>
        <div class="feat-card"><i>🎁</i>Airdrop</div>
    </div>

    <nav>
        <div class="nav-item active"><b>MINE</b></div>
        <div class="nav-item"><b>MARKET</b></div>
        <div class="nav-item"><b>WEB3</b></div>
        <div class="nav-item"><b>ASSETS</b></div>
    </nav>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    let balance = 0;

    // --- THREE.JS ENGINE (الجرافيك الـ 3D والفضاء) ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // إضافة النجوم (Stars)
    const starGeometry = new THREE.BufferGeometry();
    const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.7 });
    const starVertices = [];
    for(let i=0; i<5000; i++){
        starVertices.push((Math.random()-0.5)*2000, (Math.random()-0.5)*2000, (Math.random()-0.5)*2000);
    }
    starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
    const stars = new THREE.Points(starGeometry, starMaterial);
    scene.add(stars);

    // إضافة الكوكب المركزي (Burl Sphere)
    const geometry = new THREE.IcosahedronGeometry(10, 2);
    const material = new THREE.MeshBasicMaterial({ color: 0x00f2ff, wireframe: true });
    const sphere = new THREE.Mesh(geometry, material);
    scene.add(sphere);

    camera.position.z = 30;

    function animate() {
        requestAnimationFrame(animate);
        sphere.rotation.y += 0.005;
        sphere.rotation.x += 0.002;
        stars.rotation.y += 0.0002;
        renderer.render(scene, camera);
    }
    animate();

    // --- WEB3 & MARKET LOGIC ---
    async function getMarketData() {
        const res = await axios.get('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,the-open-network&vs_currencies=usd&include_24hr_change=true');
        const ton = res.data['the-open-network'];
        document.getElementById('ticker-content').innerText = `BTC: $${res.data.bitcoin.usd.toLocaleString()} | TON: $${ton.usd.toFixed(2)} (${ton.usd_24h_change.toFixed(1)}%) | BURL INDEX: $0.0028`;
    }

    function handleTap(e) {
        balance += 1;
        document.getElementById('bal').innerText = balance.toLocaleString();
        document.getElementById('usd-est').innerText = `$${(balance * 0.0028).toFixed(2)} USD`;
        
        // تأثير حركي للمحرك الـ 3D عند الضغط
        sphere.scale.set(1.2, 1.2, 1.2);
        setTimeout(() => sphere.scale.set(1,1,1), 100);
        
        tg.HapticFeedback.impactOccurred('heavy');
    }

    function connectWeb3() {
        tg.showPopup({
            title: 'TON Connect 2.0',
            message: 'اختر المحفظة للربط المباشر بـ Blockchain',
            buttons: [
                {id: 'ton', type: 'default', text: 'TON Keeper'},
                {id: 'okx', type: 'default', text: 'OKX Wallet'},
                {id: 'cancel', type: 'destructive', text: 'إلغاء'}
            ]
        }, (id) => {
            if(id !== 'cancel') {
                document.getElementById('wallet-status').innerText = "CONNECTED: 0x72...4a";
                document.getElementById('wallet-status').style.color = "var(--neon-blue)";
            }
        });
    }

    setInterval(getMarketData, 10000);
    getMarketData();
</script>
</body>
</html>
