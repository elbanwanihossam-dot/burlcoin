<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0a0b10; color: white; font-family: 'Segoe UI', sans-serif; margin: 0; text-align: center; overflow: hidden; }
        .card { background: rgba(255,255,255,0.05); backdrop-filter: blur(15px); border-radius: 25px; padding: 20px; margin: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .balance { font-size: 45px; font-weight: 900; color: #ffcc00; text-shadow: 0 0 20px rgba(255,204,0,0.3); }
        .coin-btn { width: 230px; height: 230px; margin: 30px auto; background: url('https://i.postimg.cc/9M77G0Z6/burlcoin.png') no-repeat center; background-size: contain; transition: transform 0.1s; cursor: pointer; filter: drop-shadow(0 0 30px rgba(255,204,0,0.2)); touch-action: manipulation; }
        .coin-btn:active { transform: scale(0.92); }
        .popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .popup-box { background: white; color: #333; padding: 30px; border-radius: 35px; width: 85%; max-width: 400px; }
        .btn-main { background: #9d6dff; color: white; border: none; padding: 18px; border-radius: 20px; width: 100%; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .energy-bar { width: 85%; height: 10px; background: #222; border-radius: 10px; margin: 15px auto; overflow: hidden; }
        .energy-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ffcc00, #ff6600); }
    </style>
</head>
<body>
    <div id="welcome" class="popup-overlay">
        <div class="popup-box">
            <img src="https://i.postimg.cc/9M77G0Z6/burlcoin.png" width="100">
            <h2 style="color:black">Ready to proceed?</h2>
            <p>بضغطك هنا، أنت توافق على شروط التعدين في BurlCoin والبدء في جمع العملات.</p>
            <button class="btn-main" onclick="document.getElementById('welcome').style.display='none'">Participate</button>
        </div>
    </div>
    <div class="card">
        <div style="opacity: 0.5; font-size: 12px;">BURLCOIN TOTAL</div>
        <div class="balance" id="bal">0</div>
        <div class="energy-bar"><div class="energy-fill" id="fill"></div></div>
        <div style="font-size: 14px;">⚡ Energy: <span id="nrg">1000</span></div>
    </div>
    <div class="coin-btn" id="coin"></div>
    <script>
        const tg = window.Telegram.WebApp; tg.expand();
        let b = 0; let e = 1000;
        document.getElementById('coin').onclick = () => {
            if(e > 0) {
                b++; e--;
                document.getElementById('bal').innerText = b.toLocaleString();
                document.getElementById('nrg').innerText = e;
                document.getElementById('fill').style.width = (e/10) + '%';
                tg.HapticFeedback.impactOccurred('medium');
            }
        };
    </script>
</body>
</html>
