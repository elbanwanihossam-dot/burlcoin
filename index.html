<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #0a0b10; color: white; font-family: sans-serif; text-align: center; margin: 0; }
        .card { background: rgba(255,255,255,0.05); backdrop-filter: blur(15px); border-radius: 30px; padding: 20px; margin: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .balance { font-size: 40px; font-weight: bold; color: #ffcc00; }
        /* تصميم العملة 4D */
        .coin { width: 200px; height: 200px; margin: 40px auto; background: url('https://i.postimg.cc/9M77G0Z6/burlcoin.png'); background-size: contain; transition: transform 0.1s; cursor: pointer; filter: drop-shadow(0 0 20px #ffcc0044); }
        .coin:active { transform: scale(0.9) rotateY(15deg); }
        /* برواز هامستر (Popup) */
        .popup { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .popup-content { background: white; color: black; padding: 30px; border-radius: 30px; width: 80%; text-align: center; }
        .btn { background: #9d6dff; color: white; border: none; padding: 15px 40px; border-radius: 15px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 20px; }
    </style>
</head>
<body>
    <div id="welcomePopup" class="popup">
        <div class="popup-content">
            <img src="https://i.postimg.cc/9M77G0Z6/burlcoin.png" width="80">
            <h2 style="margin: 10px 0;">Ready to proceed?</h2>
            <p style="color: #666;">By clicking this button you agree to start mining BurlCoin.</p>
            <button class="btn" onclick="document.getElementById('welcomePopup').style.display='none'">Participate</button>
        </div>
    </div>

    <div class="card">
        <div style="opacity: 0.6; font-size: 12px;">BURLCOIN TOTAL</div>
        <div class="balance" id="bal">0</div>
        <div style="margin-top: 10px;">⚡ Energy: <span id="nrg">1000</span></div>
    </div>

    <div class="coin" id="tapBtn"></div>

    <script>
        let b = 0; let e = 1000;
        const tg = window.Telegram.WebApp;
        tg.expand();
        document.getElementById('tapBtn').onclick = () => {
            if(e > 0) {
                b++; e--;
                document.getElementById('bal').innerText = b.toLocaleString();
                document.getElementById('nrg').innerText = e;
                tg.HapticFeedback.impactOccurred('medium');
            }
        };
    </script>
</body>
</html>
