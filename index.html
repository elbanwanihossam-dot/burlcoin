<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');

        body {
            margin: 0; background: #020205; color: white;
            font-family: 'Orbitron', sans-serif; overflow: hidden;
            height: 100vh; display: flex; flex-direction: column;
        }

        /* خلفية النجوم المتحركة */
        #starfield { position: fixed; top: 0; left: 0; z-index: -1; }

        .container { flex: 1; display: flex; flex-direction: column; align-items: center; z-index: 1; }

        .balance-box {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 212, 255, 0.3);
            border-radius: 20px; padding: 20px 50px;
            margin-top: 40px; box-shadow: 0 0 40px rgba(0, 212, 255, 0.2);
            text-align: center;
        }

        .coin-area { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; }
        
        .main-coin {
            width: 250px; height: 250px;
            background: url('https://i.postimg.cc/9M77G0Z6/burlcoin.png') no-repeat center;
            background-size: contain; cursor: pointer;
            filter: drop-shadow(0 0 35px #7241ff);
            animation: spaceFloat 4s ease-in-out infinite;
        }

        @keyframes spaceFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(10deg); }
        }

        /* تصميم القائمة السفلية زي هامستر بالضبط */
        .bottom-menu {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 8px; padding: 15px; background: rgba(0, 0, 0, 0.85);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .menu-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px; padding: 10px; text-align: center;
            font-size: 10px; cursor: pointer; border: 1px solid transparent;
        }

        .menu-item img { width: 24px; margin-bottom: 5px; display: block; margin-left: auto; margin-right: auto; }
        .menu-item:active { border-color: #00d4ff; background: rgba(0, 212, 255, 0.1); }

        .energy-txt { font-size: 12px; color: #00d4ff; margin-bottom: 15px; }
    </style>
</head>
<body>
    <canvas id="starfield"></canvas>

    <div class="container">
        <div class="balance-box">
            <div style="font-size: 12px; opacity: 0.6;">BURL BALANCE</div>
            <div style="font-size: 40px; font-weight: 900;" id="bal">0</div>
        </div>

        <div class="coin-area">
            <div class="main-coin" onclick="tap(event)"></div>
        </div>

        <div class="energy-txt">⚡ <span id="nrg">1000</span> / 1000</div>
    </div>

    <div class="bottom-menu">
        <div class="menu-item"><img src="https://cdn-icons-png.flaticon.com/512/3081/3081840.png">GAMES</div>
        <div class="menu-item"><img src="https://cdn-icons-png.flaticon.com/512/2854/2854211.png">WALLET</div>
        <div class="menu-item"><img src="https://cdn-icons-png.flaticon.com/512/9187/9187604.png">TASKS</div>
        <div class="menu-item"><img src="https://cdn-icons-png.flaticon.com/512/1250/1250592.png">INVITE</div>
    </div>

    <script>
        let b = 0; let e = 1000;
        const tg = window.Telegram.WebApp;
        tg.expand();

        function tap(event) {
            if(e > 0) {
                b++; e--;
                document.getElementById('bal').innerText = b.toLocaleString();
                document.getElementById('nrg').innerText = e;
                tg.HapticFeedback.impactOccurred('medium');
            }
        }

        // كود النجوم المتحركة
        const canvas = document.getElementById('starfield');
        const ctx = canvas.getContext('2d');
        let stars = [];
        function initStars() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            stars = [];
            for(let i=0; i<150; i++) stars.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, r: Math.random()*1.5, s: Math.random()*0.5});
        }
        function drawStars() {
            ctx.clearRect(0,0,canvas.width, canvas.height);
            ctx.fillStyle = "white";
            stars.forEach(s => {
                ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
                s.y += s.s; if(s.y > canvas.height) s.y = 0;
            });
            requestAnimationFrame(drawStars);
        }
        window.onresize = initStars; initStars(); drawStars();
    </script>
</body>
</html>
