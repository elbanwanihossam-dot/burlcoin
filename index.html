<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap');

        body {
            margin: 0; padding: 0;
            background: #05070a url('https://www.transparenttextures.com/patterns/stardust.png');
            color: white; font-family: 'Orbitron', sans-serif;
            height: 100vh; overflow: hidden;
            display: flex; flex-direction: column;
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
        }

        /* الطبقة العلوية للأسعار */
        .top-bar {
            display: flex; justify-content: space-around; padding: 15px;
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 212, 255, 0.2); font-size: 12px;
        }
        .crypto-info { color: #00d4ff; text-shadow: 0 0 10px #00d4ff; }

        /* حاوية الرصيد الزجاجية */
        .balance-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 15px 40px;
            margin-top: 30px; backdrop-filter: blur(20px);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }
        .balance-text { font-size: 32px; font-weight: 900; color: #fff; letter-spacing: 2px; }
        .balance-text span { color: #00d4ff; }

        /* منطقة العملة المركزية */
        .mining-zone {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; position: relative;
        }

        .coin-glow {
            position: absolute; width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(114, 65, 255, 0.3) 0%, transparent 70%);
            z-index: 1;
        }

        .main-coin {
            width: 240px; height: 240px; z-index: 2;
            background: url('https://i.postimg.cc/9M77G0Z6/burlcoin.png') no-repeat center;
            background-size: contain; cursor: pointer;
            filter: drop-shadow(0 0 25px rgba(0, 212, 255, 0.5));
            animation: rotate3d 5s linear infinite;
        }

        @keyframes rotate3d {
            0% { transform: perspective(1000px) rotateY(0deg) translateY(0); }
            50% { transform: perspective(1000px) rotateY(15deg) translateY(-10px); }
            100% { transform: perspective(1000px) rotateY(0deg) translateY(0); }
        }

        /* شريط الطاقة المضيء */
        .energy-container { width: 80%; margin-bottom: 20px; text-align: center; }
        .energy-bar {
            height: 12px; background: rgba(255,255,255,0.1);
            border-radius: 20px; overflow: hidden; border: 1px solid rgba(0,212,255,0.3);
        }
        .energy-fill {
            width: 100%; height: 100%;
            background: linear-gradient(90deg, #00d4ff, #7241ff);
            box-shadow: 0 0 15px #00d4ff; transition: 0.3s;
        }

        /* الأزرار السفلية (Style الصورة) */
        .footer-nav {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 10px; padding: 20px; background: rgba(0,0,0,0.5);
        }
        .nav-btn {
            background: rgba(114, 65, 255, 0.1); border: 1px solid #7241ff;
            border-radius: 12px; padding: 12px 5px; text-align: center;
            font-size: 10px; font-weight: bold; transition: 0.3s;
        }
        .nav-btn:active { background: #7241ff; transform: scale(0.9); }

        /* تأثير النقاط المتطايرة (+1) */
        .tap-effect {
            position: absolute; color: #ffcc00; font-weight: 900;
            font-size: 24px; pointer-events: none; animation: flyUp 0.6s ease-out forwards;
            text-shadow: 0 0 10px #ffcc00; z-index: 10;
        }
        @keyframes flyUp { 
            0% { opacity: 1; transform: translateY(0); } 
            100% { opacity: 0; transform: translateY(-120px) scale(1.5); } 
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="crypto-info">🚀 BTC: <span id="btc-p">--</span></div>
        <div class="crypto-info">💎 TON: <span id="ton-p">--</span></div>
    </div>

    <div style="display: flex; justify-content: center;">
        <div class="balance-card">
            <div class="balance-text">BURL BALANCE: <span id="balance">0</span></div>
        </div>
    </div>

    <div class="mining-zone">
        <div class="coin-glow"></div>
        <div class="main-coin" id="coin" onclick="handleTap(event)"></div>
    </div>

    <div class="energy-container">
        <div class="energy-bar"><div class="energy-fill" id="efill"></div></div>
        <p style="font-size: 12px; margin-top: 10px;">⚡ ENERGY: <span id="eval">1000</span> / 1000</p>
    </div>

    <div class="footer-nav">
        <div class="nav-btn" onclick="alert('Shop')">🛒 SHOP</div>
        <div class="nav-btn" onclick="alert('Tasks')">📝 TASKS</div>
        <div class="nav-btn" onclick="alert('Invite')">👥 INVITE</div>
        <div class="nav-btn" onclick="alert('Wallet')">👛 WALLET</div>
    </div>

    <script>
        let b = 0; let e = 1000;
        const tg = window.Telegram.WebApp;
        tg.expand();

        function handleTap(event) {
            if(e > 0) {
                b += 1; e -= 1;
                document.getElementById('balance').innerText = b.toLocaleString();
                document.getElementById('eval').innerText = e;
                document.getElementById('efill').style.width = (e/10) + '%';

                // تأثير الاهتزاز
                tg.HapticFeedback.impactOccurred('heavy');

                // إنشاء رقم متطاير (+1)
                const p = document.createElement('div');
                p.className = 'tap-effect'; p.innerText = '+1';
                p.style.left = event.pageX + 'px'; p.style.top = event.pageY + 'px';
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 600);
            }
        }

        async function fetchPrices() {
            try {
                const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,the-open-network&vs_currencies=usd');
                const data = await res.json();
                document.getElementById('btc-p').innerText = '$' + data.bitcoin.usd.toLocaleString();
                document.getElementById('ton-p').innerText = '$' + data['the-open-network'].usd.toFixed(2);
            } catch(e) {}
        }
        setInterval(fetchPrices, 10000); fetchPrices();
    </script>
</body>
</html>
