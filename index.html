<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BurlCoin - 4D Mining</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --gold: #ffcc00;
            --gold-glow: rgba(255, 204, 0, 0.4);
            --bg-dark: #0a0b10;
        }

        body {
            background: radial-gradient(circle at center, #1a1c2c 0%, var(--bg-dark) 100%);
            color: white;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* حاوية الرصيد الزجاجية */
        .stats-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 20px;
            width: 85%;
            margin-top: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .balance-label { font-size: 12px; opacity: 0.6; letter-spacing: 2px; margin-bottom: 5px; }
        .balance-value { font-size: 42px; font-weight: 900; color: var(--gold); text-shadow: 0 0 20px var(--gold-glow); }

        /* منطقة العملة 4D */
        .coin-section {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        .coin-btn {
            width: 240px;
            height: 240px;
            background: url('https://i.ibb.co/L8N76Xn/gold-coin.png') no-repeat center;
            background-size: contain;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.05s ease-out;
            filter: drop-shadow(0 0 30px var(--gold-glow));
            touch-action: manipulation;
        }

        /* تأثير الحركة عند الضغط */
        .coin-btn:active {
            transform: scale(0.92) rotateX(10deg) rotateY(-10deg);
        }

        /* شريط الطاقة */
        .energy-section { width: 85%; margin-bottom: 40px; }
        .energy-bar {
            width: 100%;
            height: 12px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .energy-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ffcc00, #ff6600);
            box-shadow: 0 0 10px var(--gold-glow);
            transition: width 0.2s ease;
        }

        /* أرقام النقاط الطائرة */
        .floating-text {
            position: fixed;
            color: var(--gold);
            font-weight: bold;
            font-size: 24px;
            pointer-events: none;
            animation: floatUp 0.7s ease-out forwards;
            z-index: 100;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) opacity: 1; }
            100% { transform: translateY(-100px) opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="stats-container">
        <div class="balance-label">BURLCOIN TOTAL</div>
        <div class="balance-value" id="balance">0</div>
        <div style="margin-top: 10px; font-size: 14px; opacity: 0.8;">⛏ Profit per hour: +0</div>
    </div>

    <div class="coin-section">
        <div class="coin-btn" id="coin"></div>
    </div>

    <div class="energy-section">
        <div style="display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 14px;">
            <span>⚡ الطاقة</span>
            <span><span id="energy">1000</span>/1000</span>
        </div>
        <div class="energy-bar">
            <div class="energy-fill" id="energyFill"></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // فتح الشاشة بالكامل
        tg.enableClosingConfirmation(); // تأكيد قبل الخروج

        let balance = localStorage.getItem('bal') ? parseInt(localStorage.getItem('bal')) : 0;
        let energy = 1000;

        const balanceEl = document.getElementById('balance');
        const energyEl = document.getElementById('energy');
        const energyFill = document.getElementById('energyFill');
        const coinBtn = document.getElementById('coin');

        // تحديث الواجهة عند التحميل
        function updateUI() {
            balanceEl.innerText = balance.toLocaleString();
            energyEl.innerText = energy;
            energyFill.style.width = (energy / 10) + '%';
        }
        updateUI();

        // حدث الضغط على العملة
        coinBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (energy > 0) {
                balance += 1;
                energy -= 1;
                
                // حفظ الرصيد محلياً
                localStorage.setItem('bal', balance);
                
                // تأثير الاهتزاز (Haptic)
                tg.HapticFeedback.impactOccurred('medium');
                
                updateUI();
                showFloatingText(e.touches[0].clientX, e.touches[0].clientY);
            } else {
                tg.HapticFeedback.notificationOccurred('error');
            }
        });

        function showFloatingText(x, y) {
            const text = document.createElement('div');
            text.innerText = '+1';
            text.className = 'floating-text';
            text.style.left = x + 'px';
            text.style.top = y + 'px';
            document.body.appendChild(text);
            setTimeout(() => text.remove(), 700);
        }

        // شحن الطاقة تلقائياً (1 طاقة كل 3 ثواني)
        setInterval(() => {
            if (energy < 1000) {
                energy++;
                updateUI();
            }
        }, 3000);
    </script>
</body>
</html>
