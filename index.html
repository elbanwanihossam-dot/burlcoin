<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BurlCoin Galactic Web3 Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root { --neon: #00f2ff; --purple: #bc13fe; --gold: #f3ba2f; --glass: rgba(255, 255, 255, 0.05); }
        body, html { margin: 0; padding: 0; background: #000; color: #fff; font-family: 'Exo 2', sans-serif; overflow: hidden; height: 100%; }
        
        #space-canvas { position: fixed; top: 0; left: 0; z-index: -1; }

        .app-shell { height: 100vh; display: flex; flex-direction: column; position: relative; z-index: 10; backdrop-filter: blur(2px); }

        /* Header & Market */
        header { padding: 15px; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
        .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .wallet-pill { background: var(--glass); border: 1px solid var(--neon); padding: 5px 12px; border-radius: 20px; font-size: 12px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
        .live-ticker { background: rgba(0,242,255,0.1); padding: 5px; border-radius: 5px; font-size: 10px; overflow: hidden; white-space: nowrap; border: 1px solid rgba(0,242,255,0.2); }
        .ticker-track { display: flex; gap: 20px; animation: scroll 25s linear infinite; }

        /* Balance & Visuals */
        .main-stats { text-align: center; margin: 20px 0; }
        .balance-label { font-family: 'Orbitron', sans-serif; font-size: 3.5rem; font-weight: 900; background: linear-gradient(45deg, #fff, var(--neon)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; drop-shadow: 0 0 15px var(--neon); }
        .profit-hour { color: var(--gold); font-size: 14px; letter-spacing: 2px; text-transform: uppercase; }

        /* Navigation Tabs */
        .content-area { flex-grow: 1; overflow-y: auto; padding: 0 15px; display: none; margin-bottom: 80px; }
        .content-area.active { display: block; }

        /* Clicker Tab */
        .clicker-container { height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        #burl-node { width: 260px; height: 260px; position: relative; cursor: pointer; z-index: 5; }
        .particle { position: absolute; pointer-events: none; color: var(--neon); font-weight: bold; animation: floatUp 1s ease-out forwards; }

        /* Market Tab Cards */
        .market-card { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; padding: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(10px); }
        .btn-action { background: var(--neon); color: #000; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }

        /* Bottom Menu */
        nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 75px; background: rgba(0,0,0,0.9); border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-around; align-items: center; backdrop-filter: blur(20px); }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; color: #666; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: var(--neon); transform: scale(1.1); }
        .nav-item i { font-size: 20px; }

        @keyframes scroll { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
        @keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-100px) scale(1.5); } }
    </style>
</head>
<body>

<canvas id="space-canvas"></canvas>

<div class="app-shell">
    <header>
        <div class="top-row">
            <div style="display:flex; align-items:center; gap:10px">
                <div style="width:30px; height:30px; background:var(--gold); border-radius:8px"></div>
                <span style="font-weight:bold; letter-spacing:1px">BURL_CORP v2.0</span>
            </div>
            <div class="wallet-pill" onclick="connectWallet()">
                <span id="wallet-text">CONNECT WALLET</span>
                <div style="width:8px; height:8px; background:#f00; border-radius:50%" id="wallet-status"></div>
            </div>
        </div>
        <div class="live-ticker">
            <div class="ticker-track" id="market-ticker">Loading global market data...</div>
        </div>
    </header>

    <div class="main-stats">
        <div class="profit-hour">Profit Per Hour: +<span id="pph-val">0</span> ⛏️</div>
        <div class="balance-label" id="balance">0</div>
        <div style="color:var(--neon); font-size:12px" id="ton-equiv">≈ 0.00 TON</div>
    </div>

    <div id="tab-clicker" class="content-area active">
        <div class="clicker-container">
            <div id="burl-node"></div>
        </div>
    </div>

    <div id="tab-mining" class="content-area">
        <h2 style="font-family:'Orbitron'">Mining Upgrades</h2>
        <div class="market-card">
            <div><b>Quantum Server</b><br><small>Cost: 500 | +25 PPH</small></div>
            <button class="btn-action" onclick="upgrade(500, 25)">BUY</button>
        </div>
        <div class="market-card">
            <div><b>Satellite Node</b><br><small>Cost: 2000 | +120 PPH</small></div>
            <button class="btn-action" onclick="upgrade(2000, 120)">BUY</button>
        </div>
        <div class="market-card">
            <div><b>AI Overlord</b><br><small>Cost: 10000 | +750 PPH</small></div>
            <button class="btn-action" onclick="upgrade(10000, 750)">BUY</button>
        </div>
    </div>

    <div id="tab-market" class="content-area">
        <h2 style="font-family:'Orbitron'">Live Web3 Assets</h2>
        <div id="assets-list"></div>
    </div>

    <nav>
        <div class="nav-item active" onclick="switchTab('clicker', this)"><i>💰</i><span>EARN</span></div>
        <div class="nav-item" onclick="switchTab('mining', this)"><i>⛏️</i><span>MINE</span></div>
        <div class="nav-item" onclick="switchTab('market', this)"><i>📊</i><span>EXCHANGE</span></div>
        <div class="nav-item" onclick="tg.showAlert('Settings coming soon')"><i>⚙️</i><span>WEB3</span></div>
    </nav>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    
    let state = {
        bal: 0,
        pph: 0,
        uid: tg.initDataUnsafe.user?.id || 12345,
        tonPrice: 5.4,
        isWalletConnected: false
    };

    // --- 1. THREE.JS DEEP SPACE ENGINE ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('space-canvas'), antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    // Stars & Nebula
    const starGeo = new THREE.BufferGeometry();
    const starCoords = [];
    for(let i=0; i<10000; i++) starCoords.push((Math.random()-0.5)*2000, (Math.random()-0.5)*2000, (Math.random()-0.5)*2000);
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0x888888, size: 0.5}));
    scene.add(stars);

    // Burl Node (Central 3D Object)
    const nodeGeo = new THREE.IcosahedronGeometry(12, 1);
    const nodeMat = new THREE.MeshPhongMaterial({ color: 0x00f2ff, wireframe: true, emissive: 0x00f2ff, emissiveIntensity: 0.5 });
    const nodeMesh = new THREE.Mesh(nodeGeo, nodeMat);
    scene.add(nodeMesh);

    const light = new THREE.PointLight(0xffffff, 1);
    light.position.set(20, 20, 20);
    scene.add(light);
    camera.position.z = 40;

    function animate() {
        requestAnimationFrame(animate);
        nodeMesh.rotation.y += 0.005;
        nodeMesh.rotation.x += 0.002;
        stars.rotation.y += 0.0001;
        renderer.render(scene, camera);
    }
    animate();

    // --- 2. LOGIC & API ---
    async function fetchMarket() {
        try {
            const r = await axios.get('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,the-open-network,solana&vs_currencies=usd&include_24hr_change=true');
            const d = r.data;
            state.tonPrice = d['the-open-network'].usd;
            
            const ticker = document.getElementById('market-ticker');
            ticker.innerHTML = `
                <span>BTC: $${d.bitcoin.usd.toLocaleString()}</span>
                <span>TON: $${d['the-open-network'].usd.toFixed(2)}</span>
                <span>ETH: $${d.ethereum.usd.toLocaleString()}</span>
                <span>SOL: $${d.solana.usd.toFixed(2)}</span>
            `;

            const list = document.getElementById('assets-list');
            list.innerHTML = Object.entries(d).map(([id, val]) => `
                <div class="market-card">
                    <div><b>${id.toUpperCase()}</b><br><small>$${val.usd}</small></div>
                    <div style="color:${val.usd_24h_change > 0 ? '#00ff88' : '#ff4444'}">${val.usd_24h_change.toFixed(2)}%</div>
                </div>
            `).join('');
            
            updateUI();
        } catch(e) { console.error("Market data failed"); }
    }

    function updateUI() {
        document.getElementById('balance').innerText = Math.floor(state.bal).toLocaleString();
        document.getElementById('pph-val').innerText = state.pph.toLocaleString();
        document.getElementById('ton-equiv').innerText = `≈ ${(state.bal / 50000).toFixed(4)} TON`;
    }

    function tap(e) {
        state.bal += 1;
        updateUI();
        tg.HapticFeedback.impactOccurred('medium');
        
        // 3D Visual Feedback
        nodeMesh.scale.set(1.1, 1.1, 1.1);
        setTimeout(() => nodeMesh.scale.set(1, 1, 1), 50);

        // Particle Effect
        const p = document.createElement('div');
        p.className = 'particle';
        p.innerText = '+1';
        p.style.left = (e.clientX || window.innerWidth/2) + 'px';
        p.style.top = (e.clientY || window.innerHeight/2) + 'px';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1000);
    }

    function upgrade(cost, pph) {
        if(state.bal >= cost) {
            state.bal -= cost;
            state.pph += pph;
            tg.showAlert("Upgrade Successful!");
            updateUI();
        } else { tg.showAlert("Insufficient BurlCoins!"); }
    }

    function switchTab(tab, el) {
        document.querySelectorAll('.content-area').forEach(c => c.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
        
        // Hide 3D Node on other tabs
        nodeMesh.visible = (tab === 'clicker');
    }

    function connectWallet() {
        if(state.isWalletConnected) return;
        tg.showPopup({
            title: 'Web3 Gateway',
            message: 'Select your preferred TON wallet',
            buttons: [{text: 'Tonkeeper', id: 'tk'}, {text: 'MyTonWallet', id: 'mw'}]
        }, (id) => {
            state.isWalletConnected = true;
            document.getElementById('wallet-text').innerText = '0x74...F2';
            document.getElementById('wallet-status').style.background = '#00ff88';
            tg.HapticFeedback.notificationOccurred('success');
        });
    }

    // Passive Income
    setInterval(() => {
        state.bal += (state.pph / 3600);
        updateUI();
    }, 1000);

    document.getElementById('burl-node').onclick = tap;
    setInterval(fetchMarket, 10000);
    window.onload = fetchMarket;
</script>
</body>
</html>
