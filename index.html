<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BurlCoin CEO Edition</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --primary: #f3ba2f; --bg: #0b0e11; --card: #1e2329; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; }
        .app { padding: 15px; height: 100vh; display: flex; flex-direction: column; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: var(--card); padding: 10px; border-radius: 12px; text-align: center; border: 1px solid #333; }
        .balance { text-align: center; font-size: 3rem; font-weight: 800; color: var(--primary); margin: 20px 0; text-shadow: 0 0 20px rgba(243, 186, 47, 0.2); }
        
        .coin-btn { width: 220px; height: 220px; background: radial-gradient(circle, #f3ba2f 0%, #a87f1a 100%); 
                    border-radius: 50%; margin: auto; display: flex; align-items: center; justify-content: center;
                    box-shadow: 0 0 40px rgba(243, 186, 47, 0.3); cursor: pointer; transition: transform 0.05s; }
        .coin-btn:active { transform: scale(0.92); }

        .panel { display: none; flex-direction: column; gap: 15px; padding: 20px 0; overflow-y: auto; }
        .active { display: flex; }
        .card { background: var(--card); padding: 15px; border-radius: 15px; border: 1px solid #444; display: flex; justify-content: space-between; align-items: center; }
        
        nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #181a20; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid #333; z-index: 100; }
        .nav-item { color: #848e9c; cursor: pointer; transition: 0.3s; }
        .nav-item.active-tab { color: var(--primary); font-weight: bold; transform: translateY(-3px); }

        #game-box { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 1000; }
    </style>
</head>
<body>

<div class="app">
    <div class="stat-grid">
        <div class="stat-card">🏆 Level<br><span id="lvl">1</span></div>
        <div class="stat-card">⛏️ PPH<br><span id="pph">0</span></div>
    </div>

    <div id="tab-home" class="panel active">
        <div class="balance" id="bal">0</div>
        <div class="coin-btn" onclick="tap()">
            <img src="https://cryptologos.cc/logos/toncoin-ton-logo.png" width="120">
        </div>
    </div>

    <div id="tab-mine" class="panel">
        <h2 style="color: var(--primary);">Mining Center ⛏️</h2>
        <div class="card">
            <div><b>AI Bot 🤖</b><br><small>Cost: 1,000 | +50 PPH</small></div>
            <button onclick="buy(1000, 50)" style="background:var(--primary); border:none; padding:10px 20px; border-radius:10px; font-weight:bold;">Upgrade</button>
        </div>
        <div class="card">
            <div><b>Server Farm 🏢</b><br><small>Cost: 5,000 | +300 PPH</small></div>
            <button onclick="buy(5000, 300)" style="background:var(--primary); border:none; padding:10px 20px; border-radius:10px; font-weight:bold;">Upgrade</button>
        </div>
    </div>

    <div id="tab-games" class="panel">
        <h2 style="color: var(--primary);">Mini Games 🎮</h2>
        <div class="card" style="flex-direction: column; text-align: center; gap: 15px;">
            <div style="font-size: 1.2rem;"><b>Burl Jump 🚀</b></div>
            <p>Jump to earn free coins!</p>
            <button onclick="playGame()" style="background:#0088cc; color:white; border:none; width:100%; padding:15px; border-radius:12px; font-weight:bold;">PLAY NOW</button>
        </div>
    </div>

    <nav>
        <div class="nav-item active-tab" onclick="switchTab('home', this)">💰 Earn</div>
        <div class="nav-item" onclick="switchTab('mine', this)">⛏️ Mine</div>
        <div class="nav-item" onclick="switchTab('games', this)">🎮 Games</div>
    </nav>
</div>

<div id="game-box">
    <canvas id="gameCanvas"></canvas>
    <div id="gameScore" style="position:absolute; top:40px; width:100%; text-align:center; font-size:3rem; font-weight:bold;">0</div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    let state = { bal: 0, pph: 0, uid: tg.initDataUnsafe.user?.id || 12345 };

    async function init() {
        try {
            const r = await fetch(`http://localhost:3000/userData/${state.uid}`);
            const res = await r.json();
            if(res.exists) { 
                state.bal = res.data.balance; 
                state.pph = res.data.pph; 
            }
            render();
        } catch(e) { console.log("Offline Mode"); }
    }

    function render() {
        document.getElementById('bal').innerText = Math.floor(state.bal).toLocaleString();
        document.getElementById('pph').innerText = state.pph.toLocaleString();
        document.getElementById('lvl').innerText = Math.floor(state.bal/100000) + 1;
    }

    function tap() {
        state.bal += 1;
        render();
        tg.HapticFeedback.impactOccurred('medium');
    }

    function buy(cost, pph) {
        if(state.bal >= cost) {
            state.bal -= cost;
            state.pph += pph;
            render();
            sync();
        } else { tg.showAlert("Need more coins!"); }
    }

    async function sync() {
        fetch('http://localhost:3000/sync', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ userId: state.uid, balance: state.bal, pph: state.pph })
        });
    }

    function switchTab(id, el) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById('tab-'+id).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active-tab'));
        el.classList.add('active-tab');
    }

    // GAME ENGINE
    function playGame() {
        const box = document.getElementById('game-box');
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        box.style.display = 'block';
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        
        let score = 0, y = 300, v = 0, active = true;
        
        function draw() {
            if(!active) return;
            v += 0.5; y += v;
            ctx.clearRect(0,0,canvas.width, canvas.height);
            ctx.fillStyle = "#f3ba2f";
            ctx.beginPath(); ctx.arc(canvas.width/2, y, 25, 0, Math.PI*2); ctx.fill();
            
            if(y > canvas.height || y < 0) {
                active = false;
                box.style.display = 'none';
                state.bal += score;
                tg.showAlert(`Game Over! Earned: ${score}`);
                sync(); render();
            }
            score++;
            document.getElementById('gameScore').innerText = score;
            requestAnimationFrame(draw);
        }
        canvas.onclick = () => v = -8;
        draw();
    }

    setInterval(() => { state.bal += (state.pph/3600); render(); }, 1000);
    setInterval(sync, 10000);
    window.onload = init;
</script>
</body>
</html>
