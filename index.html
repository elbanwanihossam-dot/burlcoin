<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BurlCoin Galactic Web3</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        :root { --primary: #00d2ff; --gold: #f3ba2f; --bg: #050505; }
        
        body, html { margin: 0; padding: 0; background: var(--bg); color: white; font-family: 'Orbitron', sans-serif; overflow: hidden; height: 100%; }

        /* خلفية الفضاء المتحركة */
        #space-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%); overflow: hidden; }
        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.5; animation: move 50s linear infinite; }
        @keyframes move { from { transform: translateY(0); } to { transform: translateY(-1000px); } }

        .app-wrapper { height: 100vh; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; backdrop-filter: blur(5px); }

        /* شريط أسعار العملات لايف */
        .crypto-ticker { background: rgba(255, 255, 255, 0.05); padding: 10px; border-radius: 10px; font-size: 12px; display: flex; gap: 15px; overflow-x: auto; white-space: nowrap; border: 1px solid rgba(255,255,255,0.1); }
        .ticker-item { display: flex; gap: 5px; align-items: center; }
        .up { color: #00ff88; }

        /* عداد الكوين الشيك */
        .balance-container { text-align: center; margin: 20px 0; position: relative; }
        .main-balance { font-size: 3.5rem; font-weight: 900; background: linear-gradient(to bottom, #fff, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 15px rgba(243, 186, 47, 0.5)); }
        .ton-estimate { color: #00d2ff; font-size: 14px; margin-top: 5px; letter-spacing: 2px; }

        /* زر العملة 3D */
        .coin-3d-wrap { perspective: 1000px; margin: auto; }
        .coin-3d { width: 220px; height: 220px; position: relative; transform-style: preserve-3d; transition: transform 0.1s; cursor: pointer; }
        .coin-3d:active { transform: scale(0.9) rotateX(20deg); }
        .coin-face { position: absolute; width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle, #f3ba2f, #a87f1a); box-shadow: 0 0 50px rgba(243,186,47,0.4), inset 0 0 20px rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; border: 4px solid #ffd700; }
        .coin-face img { width: 70%; filter: drop-shadow(0 0 10px rgba(0,0,0,0.5)); }

        /* الأزرار الحديثة */
        .glass-btn { background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.1); padding: 15px; border-radius: 15px; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .glass-btn:hover { background: rgba(255, 255, 255, 0.15); box-shadow: 0 0 20px var(--primary); }

        /* نافبار ويب 3 */
        nav { position: fixed; bottom: 20px; left: 20px; right: 20px; background: rgba(0, 0, 0, 0.8); border: 1px solid var(--primary); border-radius: 20px; display: flex; justify-content: space-around; padding: 15px; box-shadow: 0 0 30px rgba(0, 210, 255, 0.2); }
        .nav-link { color: #888; text-decoration: none; font-size: 12px; text-transform: uppercase; }
        .nav-link.active { color: var(--primary); text-shadow: 0 0 10px var(--primary); }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
</head>
<body>

<div id="space-bg"></div>

<div class="app-wrapper">
    <div class="crypto-ticker" id="ticker">
        <div class="ticker-item">BTC: <span id="btc-price" class="up">...</span></div>
        <div class="ticker-item">TON: <span id="ton-price" class="up">...</span></div>
        <div class="ticker-item">BURL: <span>$0.0024</span></div>
    </div>

    <div class="balance-container">
        <div class="main-balance" id="bal">0</div>
        <div class="ton-estimate" id="ton-est">≈ 0.00 TON</div>
    </div>

    <div class="coin-3d-wrap" onclick="tap(event)">
        <div class="coin-3d" id="main-coin">
            <div class="coin-face">
                <img src="https://cryptologos.cc/logos/toncoin-ton-logo.png" alt="BurlCoin">
            </div>
        </div>
    </div>

    <div id="tab-mine" style="margin-top: 20px; overflow-y: auto; flex: 1;">
        <button class="glass-btn" onclick="connectWallet()">
            <span>🔗 Connect Web3 Wallet</span>
            <small style="color: var(--primary);">Connect</small>
        </button>
        <div class="glass-btn">
            <span>🚀 Burl Multiplier</span>
            <span style="color: var(--gold);">x2.5</span>
        </div>
    </div>

    <nav>
        <a href="#" class="nav-link active">Mining</a>
        <a href="#" class="nav-link">Quests</a>
        <a href="#" class="nav-link" onclick="tg.showAlert('Web3 DEX قريباً!')">Wallet</a>
    </nav>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let state = { 
        bal: 0, 
        pph: 0, 
        uid: tg.initDataUnsafe.user?.id || 12345,
        tonPrice: 5.40 
    };

    // إنشاء النجوم في الخلفية
    const space = document.getElementById('space-bg');
    for (let i = 0; i < 150; i++) {
        let star = document.createElement('div');
        star.className = 'star';
        let size = Math.random() * 3 + 'px';
        star.style.width = size; star.style.height = size;
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDuration = (Math.random() * 50 + 20) + 's';
        space.appendChild(star);
    }

    // جلب أسعار العملات الحقيقية
    async function fetchPrices() {
        try {
            const res = await axios.get('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,the-open-network&vs_currencies=usd');
            document.getElementById('btc-price').innerText = '$' + res.data.bitcoin.usd.toLocaleString();
            document.getElementById('ton-price').innerText = '$' + res.data['the-open-network'].usd.toFixed(2);
            state.tonPrice = res.data['the-open-network'].usd;
            updateTonEstimate();
        } catch (e) { console.error("Price API Error"); }
    }

    function updateTonEstimate() {
        // افترضنا أن كل 10,000 Burl = 1 TON (نظام مقايسة)
        let estimate = (state.bal / 10000).toFixed(2);
        document.getElementById('ton-est').innerText = `≈ ${estimate} TON ($${(estimate * state.tonPrice).toFixed(2)})`;
    }

    function tap(e) {
        state.bal += 1;
        document.getElementById('bal').innerText = Math.floor(state.bal).toLocaleString();
        updateTonEstimate();
        tg.HapticFeedback.impactOccurred('heavy');
        
        // تأثير ضوئي عند الضغط
        const coin = document.getElementById('main-coin');
        coin.style.transform = 'scale(0.9) rotateY(10deg)';
        setTimeout(() => coin.style.transform = 'scale(1)', 100);
    }

    function connectWallet() {
        tg.showConfirm("هل تريد ربط محفظة TON (Web3)؟", (ok) => {
            if(ok) tg.showAlert("تم الربط بنجاح! رصيدك الآن مؤمن على Blockchain.");
        });
    }

    setInterval(fetchPrices, 30000);
    window.onload = () => { fetchPrices(); };
</script>
</body>
</html>
