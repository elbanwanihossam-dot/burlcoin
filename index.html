<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BurlCoin Galactic Web3</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --neon: #00f2ff; --gold: #f3ba2f; --glass: rgba(255, 255, 255, 0.05); }
        body { margin: 0; background: #020205; color: #fff; font-family: 'Inter', sans-serif; overflow: hidden; }
        
        /* تأثير النجوم المتحركة */
        #stars-canvas { position: fixed; top: 0; left: 0; z-index: -1; }

        .container { height: 100vh; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; }

        /* شريط الويب 3 العلوي */
        .web3-header { display: flex; justify-content: space-between; align-items: center; background: var(--glass); padding: 10px 15px; border-radius: 20px; border: 1px solid rgba(0, 242, 255, 0.2); backdrop-filter: blur(10px); }
        .wallet-btn { background: linear-gradient(90deg, #00f2ff, #0066ff); border: none; padding: 8px 15px; border-radius: 12px; color: white; font-weight: bold; font-size: 12px; cursor: pointer; }

        /* عداد الرصيد الاحترافي */
        .balance-section { text-align: center; margin: 30px 0; }
        .main-balance { font-size: 4rem; font-weight: 900; letter-spacing: -2px; background: linear-gradient(to bottom, #fff, #888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .ton-value { color: var(--neon); font-size: 1rem; opacity: 0.8; }

        /* رسم بياني للأسعار لايف */
        .chart-container { background: var(--glass); height: 120px; border-radius: 15px; margin: 15px 0; padding: 10px; border: 1px solid rgba(255,255,255,0.05); }

        /* زر العملة المركزي */
        .main-clicker { flex-grow: 1; display: flex; justify-content: center; align-items: center; position: relative; }
        .burl-coin { width: 240px; height: 240px; background: url('https://cryptologos.cc/logos/toncoin-ton-logo.png') no-repeat center; background-size: 80%; border-radius: 50%; box-shadow: 0 0 60px rgba(0, 242, 255, 0.3), inset 0 0 30px rgba(0, 242, 255, 0.2); border: 2px solid rgba(0, 242, 255, 0.5); cursor: pointer; transition: 0.1s; }
        .burl-coin:active { transform: scale(0.95) rotateY(15deg); }

        /* الأزرار والمقاييس */
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 80px; }
        .glass-card { background: var(--glass); padding: 15px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
        .glass-card h4 { margin: 0; font-size: 0.8rem; color: #888; }
        .glass-card p { margin: 5px 0 0; font-weight: bold; color: var(--gold); }

        /* القائمة السفلية */
        nav { position: fixed; bottom: 15px; left: 15px; right: 15px; height: 70px; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px); border-radius: 25px; border: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
        .nav-icon { text-align: center; font-size: 10px; color: #555; cursor: pointer; }
        .nav-icon.active { color: var(--neon); }
        .nav-icon i { font-size: 20px; display: block; margin-bottom: 4px; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<canvas id="stars-canvas"></canvas>

<div class="container">
    <header class="web3-header">
        <div style="display: flex; align-items: center; gap: 10px;">
            <div style="width: 35px; height: 35px; background: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold;">B</div>
            <span>Burl Hub</span>
        </div>
        <button class="wallet-btn" onclick="tg.showAlert('Connecting to TON Wallet...')">CONNECT WALLET</button>
    </header>

    <div class="balance-section">
        <div class="main-balance" id="bal">0</div>
        <div class="ton-value" id="ton-est">≈ 0.00 TON</div>
    </div>

    <div class="chart-container">
        <canvas id="priceChart"></canvas>
    </div>

    <div class="main-clicker">
        <div class="burl-coin" onclick="tap(event)"></div>
    </div>

    <div class="stat-grid">
        <div class="glass-card">
            <h4>BTC / USD</h4>
            <p id="btc-price">$ --,---</p>
        </div>
        <div class="glass-card">
            <h4>TON / USD</h4>
            <p id="ton-price">$ -.--</p>
        </div>
    </div>
</div>

<nav>
    <div class="nav-icon active"><i>💰</i>MINE</div>
    <div class="nav-icon"><i>🚀</i>BOOST</div>
    <div class="nav-icon"><i>📊</i>TRADE</div>
    <div class="nav-icon"><i>⚙️</i>SETTINGS</div>
</nav>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    let balance = 0;

    // 1. نظام النجوم المتحركة
    const canvas = document.getElementById('stars-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const stars = Array.from({length: 200}, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 2,
        speed: Math.random() * 0.5 + 0.1
    }));

    function animateStars() {
        ctx.clearRect(0,0,canvas.width, canvas.height);
        ctx.fillStyle = "#fff";
        stars.forEach(s => {
            s.y -= s.speed;
            if(s.y < 0) s.y = canvas.height;
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
            ctx.fill();
        });
        requestAnimationFrame(animateStars);
    }
    animateStars();

    // 2. الرسم البياني للأسعار (Live Chart)
    const chartCtx = document.getElementById('priceChart').getContext('2d');
    const priceChart = new Chart(chartCtx, {
        type: 'line',
        data: {
            labels: ['', '', '', '', '', ''],
            datasets: [{
                data: [5.2, 5.4, 5.3, 5.8, 5.6, 6.1],
                borderColor: '#00f2ff',
                tension: 0.4,
                pointRadius: 0,
                fill: true,
                backgroundColor: 'rgba(0, 242, 255, 0.1)'
            }]
        },
        options: { plugins: {legend: {display: false}}, scales: {x: {display: false}, y: {display: false}} }
    });

    // 3. جلب الأسعار الحقيقية
    async function updateMarket() {
        try {
            const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,the-open-network&vs_currencies=usd');
            const d = await r.json();
            document.getElementById('btc-price').innerText = `$${d.bitcoin.usd.toLocaleString()}`;
            document.getElementById('ton-price').innerText = `$${d['the-open-network'].usd.toFixed(2)}`;
            
            // تحديث التشارت عشوائياً للمحاكاة
            priceChart.data.datasets[0].data.shift();
            priceChart.data.datasets[0].data.push(d['the-open-network'].usd + (Math.random()-0.5));
            priceChart.update();
        } catch(e) {}
    }

    function tap(e) {
        balance += 1;
        document.getElementById('bal').innerText = balance.toLocaleString();
        document.getElementById('ton-est').innerText = `≈ ${(balance/1000).toFixed(2)} TON`;
        tg.HapticFeedback.impactOccurred('medium');
    }

    setInterval(updateMarket, 5000);
    updateMarket();
</script>
</body>
</html>
