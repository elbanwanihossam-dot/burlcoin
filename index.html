<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BurlCoin: Galactic Sovereign</title>
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=Exo+2:wght@300;600;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --neon: #00f2ff; --purple: #bc13fe; --gold: #f3ba2f; --red: #ff3e3e;
            --bg: #050508; --glass: rgba(255, 255, 255, 0.07);
        }

        body, html { margin: 0; padding: 0; background: var(--bg); color: #fff; font-family: 'Exo 2', sans-serif; overflow: hidden; height: 100vh; }

        /* --- UI LAYOUT --- */
        .app-shell { display: flex; flex-direction: column; height: 100vh; position: relative; z-index: 10; }

        /* Header Area */
        header { padding: 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
        .top-nav { display: flex; justify-content: space-between; align-items: center; }
        .level-badge { background: var(--glass); border: 1px solid var(--neon); padding: 5px 15px; border-radius: 50px; font-size: 12px; font-weight: 900; color: var(--neon); }
        
        /* Dashboard Stats */
        .dashboard { text-align: center; margin: 15px 0; }
        .balance-group { position: relative; display: inline-block; }
        .main-balance { font-family: 'Orbitron', sans-serif; font-size: 4rem; font-weight: 900; background: linear-gradient(to bottom, #fff, var(--neon)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 15px rgba(0,242,255,0.5)); }
        
        /* Progress Bar */
        .exp-bar-container { width: 80%; height: 6px; background: #1a1a1a; border-radius: 10px; margin: 10px auto; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        #exp-fill { width: 30%; height: 100%; background: var(--neon); box-shadow: 0 0 10px var(--neon); transition: 0.5s; }

        /* Mascot & Clicker */
        .game-zone { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        #mascot-container { width: 280px; height: 280px; cursor: pointer; transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; }
        #mascot-container:active { transform: scale(0.9); }
        .tap-particle { position: absolute; color: var(--neon); font-weight: 900; font-family: 'Orbitron'; pointer-events: none; animation: tapFloat 0.8s ease-out forwards; }

        /* Feature Cards */
        .feature-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 15px; margin-bottom: 90px; }
        .card { background: var(--glass); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 15px; backdrop-filter: blur(10px); position: relative; overflow: hidden; }
        .card::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(45deg, transparent, rgba(255,255,255,0.05), transparent); transform: rotate(45deg); transition: 0.5s; }
        .card:active::after { left: 100%; }
        .card i { font-size: 24px; color: var(--purple); margin-bottom: 10px; display: block; }
        .card b { font-size: 14px; display: block; }
        .card small { font-size: 10px; opacity: 0.6; }

        /* Bottom Menu */
        nav { position: fixed; bottom: 0; width: 100%; height: 85px; background: rgba(5,5,10,0.9); border-top: 1px solid rgba(0,242,255,0.2); backdrop-filter: blur(20px); display: flex; justify-content: space-around; align-items: center; padding-bottom: 15px; }
        .nav-item { color: #555; font-size: 10px; font-weight: bold; text-align: center; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: var(--neon); text-shadow: 0 0 10px var(--neon); }
        .nav-item i { font-size: 24px; margin-bottom: 5px; }

        /* Animations */
        @keyframes tapFloat { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-150px) scale(1.5); } }
        
        /* Modal Style */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .modal-box { background: #111; width: 85%; border-radius: 30px; padding: 25px; border: 1px solid var(--neon); text-align: center; }
    </style>
</head>
<body>

<div id="bg-space" style="position:fixed; inset:0; z-index:-1"></div>

<div class="app-shell">
    <header>
        <div class="top-nav">
            <div style="display:flex; align-items:center; gap:10px">
                <img id="pfp" src="https://api.dicebear.com/7.x/bottts/svg?seed=Burl" style="width:40px; border-radius:12px; border:1px solid var(--neon)">
                <div>
                    <div style="font-size:12px; font-weight:900" id="username">PILOT_X</div>
                    <div class="level-badge">LVL 04: COMMANDER</div>
                </div>
            </div>
            <button onclick="openModal('web3')" style="background:var(--neon); color:#000; border:none; padding:8px 15px; border-radius:12px; font-weight:900; font-size:10px">WEB3 CONNECT</button>
        </div>
        <div class="exp-bar-container"><div id="exp-fill"></div></div>
    </header>

    <div class="dashboard">
        <div class="main-balance" id="bal-text">0</div>
        <div style="color:var(--gold); font-size:12px; letter-spacing:2px">PROFIT PER HOUR: +<span id="pph-text">1.2K</span> ⛏️</div>
    </div>

    <div class="game-zone">
        <div id="mascot-container">
            <svg viewBox="0 0 200 200" id="mascot-svg">
                <defs>
                    <radialGradient id="grad1" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" style="stop-color:var(--neon);stop-opacity:1" />
                        <stop offset="100%" style="stop-color:var(--purple);stop-opacity:1" />
                    </radialGradient>
                </defs>
                <circle cx="100" cy="100" r="80" fill="url(#grad1)" opacity="0.2">
                    <animate attributeName="r" values="80;85;80" dur="3s" repeatCount="indefinite" />
                </circle>
                <g id="face">
                    <circle cx="70" cy="80" r="10" fill="#fff" />
                    <circle cx="130" cy="80" r="10" fill="#fff" />
                    <path d="M 70 130 Q 100 160 130 130" stroke="#fff" stroke-width="8" fill="transparent" stroke-linecap="round" />
                </g>
            </svg>
        </div>
        <div style="margin-top:20px; font-weight:900; color:var(--gold)">
            <i class="fa-solid fa-bolt"></i> <span id="energy">1000</span>/1000
        </div>
    </div>

    <div class="feature-grid" id="main-grid">
        <div class="card" onclick="openModal('upgrades')">
            <i class="fa-solid fa-rocket"></i>
            <b>Boosters</b>
            <small>Multi-tap & Speed</small>
        </div>
        <div class="card" onclick="openModal('tasks')">
            <i class="fa-solid fa-list-check"></i>
            <b>Missions</b>
            <small>Earn 500k Burl</small>
        </div>
        <div class="card" onclick="openModal('friends')">
            <i class="fa-solid fa-user-plus"></i>
            <b>Allies</b>
            <small>Invite & Get 10%</small>
        </div>
        <div class="card" onclick="openModal('leaderboard')">
            <i class="fa-solid fa-crown"></i>
            <b>Ranking</b>
            <small>Global Top 100</small>
        </div>
    </div>

    <nav>
        <div class="nav-item active"><i class="fa-solid fa-gamepad"></i><br>PLAY</div>
        <div class="nav-item"><i class="fa-solid fa-pickaxe"></i><br>MINE</div>
        <div class="nav-item"><i class="fa-solid fa-users"></i><br>FRIENDS</div>
        <div class="nav-item"><i class="fa-solid fa-parachute-box"></i><br>AIRDROP</div>
    </nav>
</div>

<div id="modal-container" class="modal" onclick="closeModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
        <h2 id="modal-title" style="font-family:'Orbitron'; color:var(--neon)">TITLE</h2>
        <div id="modal-body" style="margin:20px 0; max-height: 400px; overflow-y: auto;"></div>
        <button onclick="closeModal()" style="width:100%; padding:15px; border-radius:15px; background:var(--glass); border:1px solid #333; color:#fff; font-weight:bold">CLOSE</button>
    </div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let state = {
        bal: 0, pph: 1200, energy: 1000, maxEnergy: 1000, ept: 1, exp: 0
    };

    // --- Background Space Engine ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('bg-space').appendChild(renderer.domElement);

    const starGeo = new THREE.BufferGeometry();
    const starCoords = [];
    for(let i=0; i<10000; i++) starCoords.push((Math.random()-0.5)*2000, (Math.random()-0.5)*2000, (Math.random()-0.5)*2000);
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
    const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({color: 0x4444ff, size: 0.7}));
    scene.add(stars);
    camera.position.z = 1;

    function animate() {
        requestAnimationFrame(animate);
        stars.rotation.y += 0.0002;
        renderer.render(scene, camera);
    }
    animate();

    // --- GAME LOGIC ---
    const mascot = document.getElementById('mascot-container');
    mascot.addEventListener('touchstart', (e) => {
        if(state.energy <= 0) return;
        
        // Update State
        state.bal += state.ept;
        state.energy -= 1;
        state.exp += 0.1;
        
        // Haptics
        tg.HapticFeedback.impactOccurred('medium');
        
        // Visuals
        updateUI();
        createParticle(e.touches[0].clientX, e.touches[0].clientY);
    });

    function createParticle(x, y) {
        const p = document.createElement('div');
        p.className = 'tap-particle';
        p.innerText = `+${state.ept}`;
        p.style.left = x + 'px';
        p.style.top = y + 'px';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 800);
    }

    function updateUI() {
        document.getElementById('bal-text').innerText = Math.floor(state.bal).toLocaleString();
        document.getElementById('energy').innerText = Math.floor(state.energy);
        document.getElementById('exp-fill').style.width = (state.exp % 100) + '%';
    }

    // Modal System
    function openModal(type) {
        const m = document.getElementById('modal-container');
        const title = document.getElementById('modal-title');
        const body = document.getElementById('modal-body');
        m.style.display = 'flex';

        if(type === 'web3') {
            title.innerText = "WEB3 WALLET";
            body.innerHTML = `
                <div style="background:#1a1a1a; padding:15px; border-radius:15px; margin-bottom:10px; display:flex; align-items:center; gap:15px; cursor:pointer" onclick="connect('Tonkeeper')">
                    <img src="https://ton.org/download/tonkeeper.png" width="30"> <b>Tonkeeper</b>
                </div>
                <div style="background:#1a1a1a; padding:15px; border-radius:15px; display:flex; align-items:center; gap:15px; cursor:pointer" onclick="connect('OKX')">
                    <img src="https://pbs.twimg.com/profile_images/1615563963428134913/OitUvGMc_400x400.jpg" width="30" style="border-radius:50%"> <b>OKX Wallet</b>
                </div>
            `;
        } else if(type === 'upgrades') {
            title.innerText = "UPGRADES";
            body.innerHTML = `
                <div class="card" style="margin-bottom:10px"><b>Multitap</b><br><small>Level 5 | Cost: 50k</small></div>
                <div class="card"><b>Energy Limit</b><br><small>Level 2 | Cost: 10k</small></div>
            `;
        }
    }

    function closeModal() { document.getElementById('modal-container').style.display = 'none'; }

    function connect(name) {
        tg.showConfirm(`Connect to ${name}?`, (ok) => {
            if(ok) {
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
                closeModal();
            }
        });
    }

    // Passive Income & Energy Regen
    setInterval(() => {
        state.bal += (state.pph / 3600);
        if(state.energy < state.maxEnergy) state.energy += 1;
        updateUI();
    }, 1000);

    updateUI();
</script>
</body>
</html>
