<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;900&display=swap');
        :root { --main-color: #00d4ff; --secondary: #7241ff; --bg: #05050a; }
        body { margin: 0; background: var(--bg); color: white; font-family: 'Cairo', sans-serif; overflow: hidden; height: 100vh; }
        .page { display: none; height: calc(100vh - 70px); padding: 20px; overflow-y: auto; text-align: center; }
        .active { display: block; }
        .header { display: flex; justify-content: space-between; padding: 15px; background: rgba(0,0,0,0.6); align-items: center; border-bottom: 1px solid #222; }
        #balance { font-size: 45px; font-weight: 900; text-shadow: 0 0 20px var(--main-color); margin: 20px 0; }
        .coin-btn { width: 240px; height: 240px; cursor: pointer; transition: 0.1s; filter: drop-shadow(0 0 30px var(--secondary)); margin: 0 auto; display: block; }
        .coin-btn:active { transform: scale(0.9); }
        .energy-container { width: 80%; margin: 20px auto; }
        .energy-bar { height: 12px; background: #111; border-radius: 10px; border: 1px solid #333; overflow: hidden; }
        #energy-fill { width: 100%; height: 100%; background: linear-gradient(90deg, var(--secondary), var(--main-color)); }
        .nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: #000; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #222; }
        .nav-item { font-size: 11px; color: #555; cursor: pointer; text-align: center; }
        .nav-item.active { color: var(--main-color); }
        .card { background: #16161f; border-radius: 15px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #333; }
        .buy-btn { background: var(--main-color); border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; }
        .pop { position: absolute; color: white; font-weight: 900; animation: fadeUp 0.7s forwards; pointer-events: none; font-size: 24px; }
        @keyframes fadeUp { to { transform: translateY(-100px); opacity: 0; } }
    </style>
</head>
<body>
    <div class="header">
        <div style="font-size: 12px;">🏆 Rank: <span id="rank">CEO</span></div>
        <div id="ton-connect"></div>
    </div>

    <div id="game" class="page active">
        <div id="balance">0</div>
        <div style="color: var(--main-color); font-size: 12px; margin-bottom: 10px;">PROFIT PER HOUR: +<span id="pph">0</span></div>
        <img src="https://static.smartone.com/common/images/crypto/eth_logo.png" class="coin-btn" id="tap-btn">
        <div class="energy-container">
            <div style="margin-bottom: 5px;">⚡ <span id="nrg">1000</span>/1000</div>
            <div class="energy-bar"><div id="energy-fill"></div></div>
        </div>
    </div>

    <div id="mine" class="page">
        <h2>Upgrades & Cards</h2>
        <div class="card">
            <div><h4>Data Center</h4><p>Income: +100/h</p><p id="c1">Cost: 500</p></div>
            <button class="buy-btn" onclick="buy(1, 500, 100)">Upgrade</button>
        </div>
        <div class="card">
            <div><h4>AI Bot</h4><p>Income: +500/h</p><p id="c2">Cost: 2000</p></div>
            <button class="buy-btn" onclick="buy(2, 2000, 500)">Upgrade</button>
        </div>
    </div>

    <div class="nav">
        <div class="nav-item active" onclick="tab('game', this)">🎮<br>Game</div>
        <div class="nav-item" onclick="tab('mine', this)">⛏️<br>Mine</div>
        <div class="nav-item" onclick="tg.showAlert('Airdrop Soon!')">💎<br>Airdrop</div>
    </div>

    <script>
        let b = 0, e = 1000, p = 0;
        const tg = window.Telegram.WebApp; tg.expand();
        
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://raw.githubusercontent.com/ton-connect/demo-dapp/main/public/tonconnect-manifest.json',
            buttonRootId: 'ton-connect'
        });

        function tab(id, el) {
            document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        document.getElementById('tap-btn').addEventListener('click', (ev) => {
            if(e > 0) {
                b++; e--; update();
                const s = document.createElement('div'); s.className='pop'; s.innerText='+1';
                s.style.left=ev.pageX+'px'; s.style.top=ev.pageY+'px';
                document.body.appendChild(s); setTimeout(()=>s.remove(), 700);
                tg.HapticFeedback.impactOccurred('medium');
            }
        });

        function buy(id, cost, income) {
            if(b >= cost) { b -= cost; p += income; update(); tg.showAlert('Success!'); }
            else { tg.showAlert('No Money!'); }
        }

        function update() {
            document.getElementById('balance').innerText = Math.floor(b).toLocaleString();
            document.getElementById('pph').innerText = p.toLocaleString();
            document.getElementById('nrg').innerText = e;
            document.getElementById('energy-fill').style.width = (e/10)+'%';
        }

        setInterval(() => {
            if(p > 0) { b += (p/3600); update(); }
            if(e < 1000) { e += 2; update(); }
        }, 1000);
    </script>
</body>
</html>
